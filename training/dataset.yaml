# Датасет GenshinVision (формат Ultralytics YOLO)
# Структура:
#   data/
#     images/train/*.png   images/val/*.png
#     labels/train/*.txt   labels/val/*.txt   (YOLO: class cx cy w h, нормированные)

path: ./data
train: images/train
val: images/val

names:
  0: player            # играбельный персонаж
  1: enemy             # обычный противник
  2: elite             # элитный противник
  3: boss              # босс
  4: enemy_hp_bar      # полоска HP над противником
  5: player_hp_bar     # полоска HP персонажа (HUD)
  6: stamina_bar       # полоска стамины
  7: damage_number     # цифры урона
  8: pickup            # подбираемые предметы
  9: chest             # сундук (любого типа; при желании разделите на
                       # chest_exquisite / chest_premium / chest_precious)
  10: dialogue         # диалоговые окна
  11: minimap          # миникарта
  12: teleport_waypoint  # точка телепорта (в мире)
  13: statue_of_seven    # статуя семи архонтов
  14: oculus             # кукулиус (анемо/гео/электро/гидро/крио/пиро/дендро)
                         # — подношения статуям семи архонтов
  15: puzzle             # головоломка (монументы стихий, факелы, судьи, сейли и т.д.)
                         # при желании разбейте на puzzle_monument / puzzle_torch / puzzle_seelie

# ---- Опционально: тонкие типы врагов (детектор автоматически поднимает их
# ---- в уровни enemy/elite/boss через ENEMY_TAXONOMY в genshinvision/detect.py)
  # 16: slime               # слизень любого элемента
  # 17: hilichurl           # хиличурл (стрелок, метатель, берсерк...)
  # 18: samachurl           # самачурл (баффер/стреляет стихиями)
  # 19: mitachurl           # митачурл (элита с щитом/топором)
  # 20: lawachurl           # лавачурл (элита-гора)
  # 21: kairagi             # кайраги (элита Инадзумы)
  # 22: nobushi              # нобуси (разбойник Инадзумы)
  # 23: ruin_guard          # руинный страж
  # 24: ruin_hunter         # руинный охотник
  # 25: ruin_machine        # руинный дрейк/крушитель/сентинел и прочие машины
  # 26: whopperflower       # цветок-обманка (пиро/крио)
  # 27: abyss_mage          # маг Бездны (пиро/гидро/крио/электро)
  # 28: fatui_agent         # агент Фатуи
  # 29: fatui_skirmisher    # копейщик/стрелок/молот Фатуи
  # 30: specter             # призрачная фея (стихия)
  # 31: vishap               # вишап (батсуй/вишап)
  # 32: hypostasis          # гипостазис (босс)
  # 33: regisvine           # цветок-регисвин (босс)
  # 34: weekly_boss         # еженедельный босс (Чильде, Синьора, Борей...)
