# Датасет GenshinVision (формат Ultralytics YOLO)
# Структура:
#   data/
#     images/train/*.png   images/val/*.png
#     labels/train/*.txt   labels/val/*.txt   (YOLO: class cx cy w h, нормированные)

path: ./data
train: images/train
val: images/val

names:
  0: player            # играбельный персонаж
  1: enemy             # обычный противник
  2: elite             # элитный противник
  3: boss              # босс
  4: enemy_hp_bar      # полоска HP над противником (запасной боевой триггер)
  5: player_hp_bar     # полоска HP персонажа (HUD)
  6: stamina_bar       # полоска стамины
  7: damage_number     # цифры урона
  8: pickup            # подбираемые предметы
  9: chest_unlocked    # сундук БЕЗ красного кольца («подойди и нажми F»);
                       # все редкости в одном классе
  10: chest_locked     # сундук в красном кольце/льду/корнях («сначала враги
                       # или головоломка вокруг»); залутанные исчезают —
                       # класс «пустой сундук» не нужен
  11: dialogue         # диалоговые окна
  12: minimap          # миникарта
  13: teleport_active  # телепорт/статуя ГОЛУБОЙ (уже открыт — игнорировать)
  14: teleport_inactive  # телепорт/статуя КРАСНЫЙ (неактивен — подойди и нажми F)
  15: oculus           # кукулиус (анемо/гео/электро/гидро/крио/пиро/дендро)
                       # — подношения статуям семи архонтов
  16: puzzle           # головоломка (монументы стихий, факелы, судьи, сейли и т.д.)
                       # при желании разбейте на puzzle_monument / puzzle_torch / puzzle_seelie
  17: ui_interact_f    # иконка клавиши F с текстом-подсказкой («Обычный сундук»,
                       # «Точка телепортации», «Подобрать») — момент разрешённого
                       # взаимодействия; самый важный класс для бота

# ---- Опционально: тонкие типы врагов (детектор автоматически поднимает их
# ---- в уровни enemy/elite/boss через ENEMY_TAXONOMY в genshinvision/detect.py)
  # 18: slime               # слизень любого элемента
  # 19: hilichurl           # хиличурл (стрелок, метатель, берсерк...)
  # 20: samachurl           # самачурл (баффер/стреляет стихиями)
  # 21: mitachurl           # митачурл (элита с щитом/топором)
  # 22: lawachurl           # лавачурл (элита-гора)
  # 23: kairagi             # кайраги (элита Инадзумы)
  # 24: nobushi             # нобуси (разбойник Инадзумы)
  # 25: ruin_guard          # руинный страж
  # 26: ruin_hunter         # руинный охотник
  # 27: ruin_machine        # руинный дрейк/крушитель/сентинел и прочие машины
  # 28: whopperflower       # цветок-обманка (пиро/крио)
  # 29: abyss_mage          # маг Бездны (пиро/гидро/крио/электро)
  # 30: fatui_agent         # агент Фатуи
  # 31: fatui_skirmisher    # копейщик/стрелок/молот Фатуи
  # 32: specter             # призрачная фея (стихия)
  # 33: vishap              # вишап (батсуй/вишап)
  # 34: hypostasis          # гипостазис (босс)
  # 35: regisvine           # цветок-регисвин (босс)
  # 36: weekly_boss         # еженедельный босс (Чильде, Синьора, Борей...)
